<main class="login-page" dir="rtl"><form class="login-card" [formGroup]="form" (ngSubmit)="submit()"><div class="login-brand"><i class="pi pi-building"></i><strong>مراقي</strong></div><h1>تسجيل الدخول</h1><p>استخدم بياناتك للوصول إلى لوحة الإدارة.</p><label>رقم الجوال<input type="tel" formControlName="phone" placeholder="05xxxxxxxx"></label><label>كلمة المرور<input type="password" formControlName="password"></label><label class="remember-option"><input type="checkbox" formControlName="rememberMe"> تذكرني على هذا الجهاز</label><button class="forgot-button" type="button" (click)="forgotPassword()">نسيت كلمة المرور؟</button>@if (error) {<div class="login-error">{{ error }}</div>}@if (message) {<div class="login-message">{{ message }}</div>}<button type="submit">دخول</button></form></main>
